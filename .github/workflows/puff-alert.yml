name: PUFF single product connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check one product through Webshare
        env:
          BOUTIQAAT_PROXY_URL: ${{ secrets.BOUTIQAAT_PROXY_URL }}
        run: |
          python3 - <<'PY'
          import check

          path = "/ar-sa/women/puff-sippii-chocolate-brown-550-ml-chrome-i-00000194251-1/p/"
          try:
              data = check.fetch(path, tries=1)
              product = data["props"]["pageProps"]["response"]
              if isinstance(product, list):
                  product = product[0]
              options = product.get("multi_configurable_option") or []
              quantities = [option.get("available_qty") for option in options]
              if not options:
                  quantities = [product.get("qty_available")]
              quantities = [int(float(quantity)) for quantity in quantities if quantity is not None]
              if not quantities:
                  raise ValueError("Product page loaded but no stock field was present")
              print("PRODUCT_PAGE_OK")
              print("STOCK_VALUES=" + ",".join(str(quantity) for quantity in quantities))
          except (RuntimeError, KeyError, IndexError, TypeError, ValueError, AttributeError) as error:
              raise SystemExit(str(error)) from None
          PY
