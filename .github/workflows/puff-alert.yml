name: PUFF restock alert

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; runs are often late)
  workflow_dispatch:
    inputs:
      test:
        description: "Test only (check site access + send a test message)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: puff-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check stock
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH: ${{ vars.WATCH }}
        run: python3 check.py ${{ inputs.test && '--test' || '' }}
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "puff-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update stock state"
            git push
          fi
